[package]
name = "weaver-core"
version = "0.1.0"
edition = "2024"

[dependencies]
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros", "chrono"] }
sha2 = "0.10"
similar = "2.6"
chrono = "0.4"
regorus = "0.2"
wasmtime = "14.0"
wasmtime-wasi = "14.0"
cap-std = "2.0"
bollard = "0.21.1"
futures-util = "0.3.34"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }